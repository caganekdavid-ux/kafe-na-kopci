<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Administrace Kafé na Kopci</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .photo-item {
            transition: all 0.3s ease;
        }
        .photo-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.15);
        }
        .photo-item:active {
            cursor: grabbing !important;
        }
        .dragging {
            opacity: 0.5;
            transform: rotate(2deg) scale(0.95);
        }
        .drag-handle {
            transition: all 0.2s ease;
        }
        .drag-handle:hover {
            background-color: rgba(251, 191, 36, 0.95) !important;
            transform: scale(1.1);
        }
        #loading {
            display: none;
        }
        #loading.active {
            display: flex;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    
    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
            <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">Kafé na Kopci</h1>
            <h2 class="text-xl text-gray-600 mb-8 text-center">Administrace</h2>
            
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                    <input 
                        type="email" 
                        id="adminEmail" 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                        required
                    />
                </div>
                
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Heslo</label>
                    <input 
                        type="password" 
                        id="adminPassword" 
                        placeholder="••••••••"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent"
                        required
                    />
                </div>
                
                <button 
                    type="submit"
                    class="w-full bg-gradient-to-r from-amber-600 to-orange-600 text-white font-bold py-3 rounded-lg hover:from-amber-700 hover:to-orange-700 transition-all shadow-lg"
                >
                    Přihlásit se
                </button>
                
                <p id="loginError" class="text-red-600 text-sm text-center hidden"></p>
            </form>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="hidden">
        <!-- Header -->
        <div class="bg-white shadow-md">
            <div class="max-w-7xl mx-auto px-4 py-3 sm:py-4 flex items-center justify-between gap-3">
                <h1 class="text-base sm:text-2xl font-bold text-gray-800 leading-tight min-w-0">
                    <span class="block sm:inline">Administrace</span>
                    <span class="block sm:inline text-amber-700 sm:text-gray-800">Kafé na Kopci</span>
                </h1>
                <button 
                    id="logoutBtn"
                    class="shrink-0 px-3 py-1.5 sm:px-4 sm:py-2 text-sm sm:text-base text-gray-600 hover:text-gray-800 font-semibold border border-gray-300 rounded-lg whitespace-nowrap"
                >
                    Odhlásit
                </button>
            </div>
            <!-- Tab Menu -->
            <div class="max-w-7xl mx-auto px-4">
                <nav class="flex gap-1 border-t border-gray-100 overflow-x-auto">
                    <button data-tab="galerie" class="tab-btn shrink-0 px-4 sm:px-5 py-3 font-semibold text-sm border-b-2 border-amber-600 text-amber-700 whitespace-nowrap">Galerie</button>
                    <button data-tab="oteviraci-doba" class="tab-btn shrink-0 px-4 sm:px-5 py-3 font-semibold text-sm border-b-2 border-transparent text-gray-500 hover:text-gray-800 whitespace-nowrap">Otevírací doba</button>
                </nav>
            </div>
        </div>

        <!-- Main Content -->
        <div class="max-w-7xl mx-auto px-4 py-8">

            <!-- TAB: Otevírací doba -->
            <div id="tab-oteviraci-doba" class="tab-panel hidden">
            <!-- Opening Hours Section -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Otevírací doba a poznámka</h2>

                <div id="hoursInputs" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
                    <!-- Inputs rendered by admin.js -->
                </div>

                <div class="mb-4">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Poznámka pod otevírací dobou (nepovinné)</label>
                    <input
                        type="text"
                        id="openingNoteInput"
                        placeholder="Např. V pátek 3. 4. zavřeno"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg"
                    />
                    <p class="text-xs text-gray-500 mt-1">Když necháte prázdné, na webu se nic nezobrazí.</p>
                </div>

                <button
                    id="saveHoursBtn"
                    class="w-full bg-gradient-to-r from-amber-600 to-amber-700 text-white font-bold py-3 rounded-lg hover:from-amber-700 hover:to-amber-800 transition-all shadow-lg"
                >
                    Uložit otevírací dobu a poznámku
                </button>
                <p class="text-xs text-gray-500 mt-2 text-center">Změna se na webu projeví do 1–2 minut.</p>
            </div>
            </div>

            <!-- TAB: Galerie -->
            <div id="tab-galerie" class="tab-panel">
            <!-- Upload Section -->
            <div class="bg-white rounded-2xl shadow-lg p-6 mb-8">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Přidat novou fotografii</h2>
                
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Vybrat fotku</label>
                        <input 
                            type="file" 
                            id="photoUpload" 
                            accept="image/*"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg"
                        />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Popisek (alt text)</label>
                        <input 
                            type="text" 
                            id="photoAlt" 
                            value="Kafé na Kopci"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg"
                        />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">Kategorie</label>
                        <select 
                            id="photoCategory"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg"
                        >
                            <option value="cafe">Kavárna</option>
                            <option value="desserts">Zákusky</option>
                            <option value="grower">Pěstitel</option>
                        </select>
                    </div>
                    
                    <div id="uploadPreview" class="hidden">
                        <p class="text-sm font-semibold text-gray-700 mb-2">Náhled:</p>
                        <img id="previewImg" class="max-h-64 rounded-lg shadow-md" />
                        <p id="previewSize" class="text-xs text-gray-500 mt-2"></p>
                    </div>
                    
                    <button 
                        id="uploadBtn"
                        class="w-full bg-gradient-to-r from-green-600 to-green-700 text-white font-bold py-3 rounded-lg hover:from-green-700 hover:to-green-800 transition-all shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                        disabled
                    >
                        Nahrát a publikovat
                    </button>
                </div>
            </div>

            <!-- Gallery Grid -->
            <div class="bg-white rounded-2xl shadow-lg p-6">
                <div class="flex items-center justify-between mb-6">
                    <h2 class="text-xl font-bold text-gray-800">Aktuální fotografie (<span id="photoCount">0</span>)</h2>
                    <button 
                        id="refreshBtn"
                        class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg font-semibold text-gray-700 transition"
                    >
                        Obnovit
                    </button>
                </div>
                
                <div id="galleryGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- Photos will be loaded here -->
                </div>
            </div>
            </div>
        </div>
    </div>

    <script>
    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.querySelectorAll('.tab-btn').forEach(function (b) {
                b.classList.remove('border-amber-600', 'text-amber-700');
                b.classList.add('border-transparent', 'text-gray-500');
            });
            btn.classList.add('border-amber-600', 'text-amber-700');
            btn.classList.remove('border-transparent', 'text-gray-500');
            document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.add('hidden'); });
            document.getElementById('tab-' + btn.dataset.tab).classList.remove('hidden');
        });
    });
    </script>

    <!-- Loading Overlay -->
    <div id="loading" class="fixed inset-0 bg-black bg-opacity-50 items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 text-center">
            <div class="animate-spin rounded-full h-16 w-16 border-b-4 border-amber-600 mx-auto mb-4"></div>
            <p id="loadingText" class="text-gray-700 font-semibold">Nahrávám...</p>
        </div>
    </div>

    <script src="admin.js?v=20260813b"></script>
</body>
</html>
