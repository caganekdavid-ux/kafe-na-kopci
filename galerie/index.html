    <style>
        .serif { font-family: 'Playfair Display', serif; }
        body { font-family: 'Inter', sans-serif; }
        
        /* Category Filter Buttons */
        .category-filter {
            background: white;
            color: #6B4423;
            border: 2px solid #E5E7EB;
        }
        
        .category-filter:hover {
            background: #FEF3C7;
            border-color: #F59E0B;
        }
        
        .category-filter.active {
            background: linear-gradient(135deg, #D97706 0%, #F59E0B 100%);
            color: white;
            border-color: #D97706;
        }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }
        
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        #lightbox.active {
            display: flex;
        }
        
        #lightbox > div {
            position: relative;
            z-index: 1;
        }
        
        #lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
        
        #lightbox-caption {
            margin-top: 1rem;
        }
        
        #lightbox button {
            z-index: 10;
        }
        
        .filter-btn {
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #6B4423 0%, #D4AF37 100%);
            color: white;
        }
        /* Mobile Menu Animations */
        #mobile-menu {
            display: none;
        }
        
        #mobile-menu.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .mobile-menu-item {
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.3s ease-out forwards;
        }
        
        #mobile-menu.show .mobile-menu-item:nth-child(1) { animation-delay: 0.05s; }
        #mobile-menu.show .mobile-menu-item:nth-child(2) { animation-delay: 0.1s; }
        #mobile-menu.show .mobile-menu-item:nth-child(3) { animation-delay: 0.15s; }
        #mobile-menu.show .mobile-menu-item:nth-child(4) { animation-delay: 0.2s; }
        
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .menu-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: inline-block;
            vertical-align: middle;
        }
        
        #mobile-menu-btn {
            transition: transform 0.3s ease;
        }
        
        #mobile-menu-btn.active {
            transform: rotate(90deg);
        }

    <script>
        // Pagination variables
        const ITEMS_PER_PAGE = 12;
        let currentPage = 1;
        let totalPages = 0;
        
        // Display gallery with pagination
        function renderGallery() {
            console.log('renderGallery called, filteredGalleryData:', filteredGalleryData);
            console.log('filteredGalleryData length:', filteredGalleryData ? filteredGalleryData.length : 'undefined');
            
            if (!filteredGalleryData || filteredGalleryData.length === 0) {
                console.log('Waiting for gallery data...');
                const grid = document.getElementById('gallery-grid');
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500"><p class="text-xl">Žádné fotky v této kategorii</p></div>';
                return;
            }
            
            totalPages = Math.ceil(filteredGalleryData.length / ITEMS_PER_PAGE);
            
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            
            // Calculate start and end indices for current page
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, filteredGalleryData.length);
            
            // Show only current page items
            for (let i = startIndex; i < endIndex; i++) {
                const item = filteredGalleryData[i];
                console.log(`Item ${i}:`, item);
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="../${item.src}" alt="${item.alt}" loading="eager">
                    <div class="gallery-caption">
                        <p class="font-semibold">${item.alt}</p>
                    </div>
                `;
                // Find original index in full galleryData for lightbox
                const originalIndex = galleryData.findIndex(photo => photo.src === item.src);
                div.addEventListener('click', () => openLightbox(originalIndex));
                grid.appendChild(div);
            }
            
            // Render pagination controls
            renderPagination();
            
            // Scroll to top of gallery
            const gallerySection = document.getElementById('gallery-grid');
            if (gallerySection) {
                gallerySection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        
        // Render pagination buttons
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            if (!pagination) return;
            
            pagination.innerHTML = '';
            
            // Previous button
            const prevBtn = document.createElement('button');
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.className = `px-4 py-2 rounded-lg transition ${currentPage === 1 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-amber-100 shadow'}`;
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderGallery();
                }
            });
            pagination.appendChild(prevBtn);
            
            // Page numbers - sliding window (max 4 visible)
            const MAX_VISIBLE_PAGES = 4;
            let startPage = 1;
            let endPage = totalPages;
            
            if (totalPages > MAX_VISIBLE_PAGES) {
                // Calculate sliding window
                const halfWindow = Math.floor(MAX_VISIBLE_PAGES / 2);
                startPage = Math.max(1, currentPage - halfWindow);
                endPage = Math.min(totalPages, startPage + MAX_VISIBLE_PAGES - 1);
                
                // Adjust if we're near the end
                if (endPage === totalPages) {
                    startPage = Math.max(1, endPage - MAX_VISIBLE_PAGES + 1);
                }
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                pageBtn.className = `px-4 py-2 rounded-lg font-semibold transition ${i === currentPage ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg' : 'bg-white text-gray-700 hover:bg-amber-100 shadow'}`;
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    renderGallery();
                });
                pagination.appendChild(pageBtn);
            }
            
            // Next button
            const nextBtn = document.createElement('button');
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.className = `px-4 py-2 rounded-lg transition ${currentPage === totalPages ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-amber-100 shadow'}`;
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderGallery();
                }
            });
            pagination.appendChild(nextBtn);
        }
        
        // Lightbox functions are in gallery.js
        // Event listeners for close/nav buttons (gallery.js handles keyboard)
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
            document.getElementById('lightbox-next').addEventListener('click', () => navigateLightbox(1));
            document.getElementById('lightbox-prev').addEventListener('click', () => navigateLightbox(-1));
            
            // Close on background click
            document.getElementById('lightbox').addEventListener('click', (e) => {
                if (e.target.id === 'lightbox') {
                    closeLightbox();
                }
            });
        });
        
        // Don't call renderGallery() here - it's called from gallery.js after data loads
    </script>
    <script src="../gallery.js"></script>
    
    <script>
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (mobileMenuBtn && mobileMenu) {
            mobileMenuBtn.addEventListener('click', function() {
                mobileMenu.classList.toggle('show');
                mobileMenuBtn.classList.toggle('active');
            });
            
            document.querySelectorAll('#mobile-menu a').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('show');
                    mobileMenuBtn.classList.remove('active');
                });
            });
        }
    </script>
