    <style>
        .serif { font-family: 'Playfair Display', serif; }
        body { font-family: 'Inter', sans-serif; }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }
        
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        #lightbox.active {
            display: flex;
        }
        
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .filter-btn {
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #6B4423 0%, #D4AF37 100%);
            color: white;
        }
        /* Mobile Menu Animations */
        #mobile-menu {
            display: none;
        }
        
        #mobile-menu.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .mobile-menu-item {
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.3s ease-out forwards;
        }
        
        #mobile-menu.show .mobile-menu-item:nth-child(1) { animation-delay: 0.05s; }
        #mobile-menu.show .mobile-menu-item:nth-child(2) { animation-delay: 0.1s; }
        #mobile-menu.show .mobile-menu-item:nth-child(3) { animation-delay: 0.15s; }
        #mobile-menu.show .mobile-menu-item:nth-child(4) { animation-delay: 0.2s; }
        
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .menu-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: inline-block;
            vertical-align: middle;
        }
        
        #mobile-menu-btn {
            transition: transform 0.3s ease;
        }
        
        #mobile-menu-btn.active {
            transform: rotate(90deg);
        }
        /* Logo hover animation */
        .logo-svg {
            transition: transform 0.3s ease;
        }
        
        .logo-svg:hover {
            transform: scale(1.05);
        }
        
        @keyframes steam {
            0%, 100% { opacity: 0.7; transform: translateY(0); }
            50% { opacity: 0.3; transform: translateY(-2px); }
        }
        
        .logo-svg:hover .steam-line {
            animation: steam 1.5s ease-in-out infinite;
        }
        
        .logo-svg:hover .steam-line:nth-child(1) { animation-delay: 0s; }
        .logo-svg:hover .steam-line:nth-child(2) { animation-delay: 0.3s; }
        .logo-svg:hover .steam-line:nth-child(3) { animation-delay: 0.6s; }


    </style>

    <script src="gallery.js"></script>
    <script>
        // Pagination variables
        const ITEMS_PER_PAGE = 12;
        let currentPage = 1;
        let totalPages = 0;
        
        // Display gallery with pagination
        function renderGallery() {
            if (!galleryData || galleryData.length === 0) {
                console.log('Waiting for gallery data...');
                return;
            }
            
            totalPages = Math.ceil(galleryData.length / ITEMS_PER_PAGE);
            
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            
            // Calculate start and end indices for current page
            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const endIndex = Math.min(startIndex + ITEMS_PER_PAGE, galleryData.length);
            
            // Show only current page items
            for (let i = startIndex; i < endIndex; i++) {
                const item = galleryData[i];
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.src}" alt="${item.alt}" loading="lazy">
                    <div class="gallery-caption">
                        <p class="font-semibold">${item.alt}</p>
                    </div>
                `;
                div.addEventListener('click', () => openLightbox(i));
                grid.appendChild(div);
            }
            
            // Render pagination controls
            renderPagination();
            
            // Scroll to top of gallery
            const gallerySection = document.getElementById('gallery-grid');
            if (gallerySection) {
                gallerySection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }
        
        // Render pagination buttons
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            if (!pagination) return;
            
            pagination.innerHTML = '';
            
            // Previous button
            const prevBtn = document.createElement('button');
            prevBtn.innerHTML = '<i class="fas fa-chevron-left"></i>';
            prevBtn.className = `px-4 py-2 rounded-lg transition ${currentPage === 1 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-amber-100 shadow'}`;
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    renderGallery();
                }
            });
            pagination.appendChild(prevBtn);
            
            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                const pageBtn = document.createElement('button');
                pageBtn.textContent = i;
                pageBtn.className = `px-4 py-2 rounded-lg font-semibold transition ${i === currentPage ? 'bg-gradient-to-r from-amber-600 to-orange-600 text-white shadow-lg' : 'bg-white text-gray-700 hover:bg-amber-100 shadow'}`;
                pageBtn.addEventListener('click', () => {
                    currentPage = i;
                    renderGallery();
                });
                pagination.appendChild(pageBtn);
            }
            
            // Next button
            const nextBtn = document.createElement('button');
            nextBtn.innerHTML = '<i class="fas fa-chevron-right"></i>';
            nextBtn.className = `px-4 py-2 rounded-lg transition ${currentPage === totalPages ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-amber-100 shadow'}`;
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    renderGallery();
                }
            });
            pagination.appendChild(nextBtn);
        }
        
        // Don't call renderGallery() here - it's called from gallery.js after data loads
    </script>
    <script>
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (mobileMenuBtn && mobileMenu) {
            mobileMenuBtn.addEventListener('click', function() {
                mobileMenu.classList.toggle('show');
                mobileMenuBtn.classList.toggle('active');
            });
            
            document.querySelectorAll('#mobile-menu a').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('show');
                    mobileMenuBtn.classList.remove('active');
                });
            });
        }
    </script>
