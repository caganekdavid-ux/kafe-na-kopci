    <style>
        .serif { font-family: 'Playfair Display', serif; }
        body { font-family: 'Inter', sans-serif; }
        
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        
        .gallery-item:hover {
            transform: translateY(-5px);
        }
        
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        
        .gallery-caption {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            color: white;
            padding: 1rem;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        
        .gallery-item:hover .gallery-caption {
            transform: translateY(0);
        }
        
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        
        #lightbox.active {
            display: flex;
        }
        
        #lightbox img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }
        
        .filter-btn {
            transition: all 0.3s ease;
        }
        
        .filter-btn.active {
            background: linear-gradient(135deg, #6B4423 0%, #D4AF37 100%);
            color: white;
        }
        /* Mobile Menu Animations */
        #mobile-menu {
            display: none;
        }
        
        #mobile-menu.show {
            display: block;
            animation: slideDown 0.3s ease-out;
        }
        
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .mobile-menu-item {
            opacity: 0;
            transform: translateX(-20px);
            animation: slideIn 0.3s ease-out forwards;
        }
        
        #mobile-menu.show .mobile-menu-item:nth-child(1) { animation-delay: 0.05s; }
        #mobile-menu.show .mobile-menu-item:nth-child(2) { animation-delay: 0.1s; }
        #mobile-menu.show .mobile-menu-item:nth-child(3) { animation-delay: 0.15s; }
        #mobile-menu.show .mobile-menu-item:nth-child(4) { animation-delay: 0.2s; }
        
        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .menu-icon {
            width: 24px;
            height: 24px;
            margin-right: 12px;
            display: inline-block;
            vertical-align: middle;
        }
        
        #mobile-menu-btn {
            transition: transform 0.3s ease;
        }
        
        #mobile-menu-btn.active {
            transform: rotate(90deg);
        }
        /* Logo hover animation */
        .logo-svg {
            transition: transform 0.3s ease;
        }
        
        .logo-svg:hover {
            transform: scale(1.05);
        }
        
        @keyframes steam {
            0%, 100% { opacity: 0.7; transform: translateY(0); }
            50% { opacity: 0.3; transform: translateY(-2px); }
        }
        
        .logo-svg:hover .steam-line {
            animation: steam 1.5s ease-in-out infinite;
        }
        
        .logo-svg:hover .steam-line:nth-child(1) { animation-delay: 0s; }
        .logo-svg:hover .steam-line:nth-child(2) { animation-delay: 0.3s; }
        .logo-svg:hover .steam-line:nth-child(3) { animation-delay: 0.6s; }


    </style>
</head>
<body class="bg-gray-50">

                <a href="galerie.html" class="mobile-menu-item flex items-center text-amber-700 font-semibold hover:bg-amber-50 px-4 py-3 rounded-xl transition-all duration-300 group">
                    <svg class="menu-icon group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                    <span class="font-medium">Galerie</span>

                <a href="index.html#produkty" class="mobile-menu-item flex items-center text-gray-800 hover:text-amber-700 hover:bg-amber-50 px-4 py-3 rounded-xl transition-all duration-300 group">
                    <svg class="menu-icon group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            </div>

                </button>

                </button>
                <button class="filter-btn px-6 py-3 rounded-full bg-gray-100 hover:bg-gray-200 font-semibold transition" data-filter="spirits">

    <!-- Gallery Grid -->

    <!-- Lightbox -->

            <i class="fas fa-chevron-right"></i>

    <!-- Footer -->

    <script src="gallery.js"></script>
    <script>
        // Gallery filtering
        const filterBtns = document.querySelectorAll('.filter-btn');
        let currentFilter = 'all';
        
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderGallery();
            });
        });
        
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            
            const filtered = currentFilter === 'all' 
                ? galleryData 
                : galleryData.filter(item => item.category === currentFilter);
            
            filtered.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'gallery-item';
                div.innerHTML = `
                    <img src="${item.src}" alt="${item.alt}" loading="lazy">
                    <div class="gallery-caption">
                        <p class="font-semibold">${item.alt}</p>
                    </div>
                `;
                div.addEventListener('click', () => openLightbox(index));
                grid.appendChild(div);
            });
        }
    </script>
    <script>
        // Mobile menu toggle
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (mobileMenuBtn && mobileMenu) {
            mobileMenuBtn.addEventListener('click', function() {
                mobileMenu.classList.toggle('show');
                mobileMenuBtn.classList.toggle('active');
            });
            
            document.querySelectorAll('#mobile-menu a').forEach(link => {
                link.addEventListener('click', () => {
                    mobileMenu.classList.remove('show');
                    mobileMenuBtn.classList.remove('active');
                });
            });
        }
    </script>
