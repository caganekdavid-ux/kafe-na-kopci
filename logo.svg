<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Kopec (hill arc) -->
  <path d="M 10 60 Q 35 30, 60 40 Q 85 50, 110 60" 
        stroke="currentColor" 
        stroke-width="2.5" 
        fill="none" 
        stroke-linecap="round"/>
  
  <!-- Šálek kávy (coffee cup) on top of the hill -->
  <g transform="translate(60, 30)">
    <!-- Cup body -->
    <path d="M -8 0 L -6 8 L 6 8 L 8 0 Z" 
          stroke="currentColor" 
          stroke-width="2" 
          fill="none" 
          stroke-linejoin="round"/>
    
    <!-- Cup handle -->
    <path d="M 8 2 Q 13 2, 13 5 Q 13 8, 8 8" 
          stroke="currentColor" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round"/>
    
    <!-- Steam lines (3 wavy lines) -->
    <path d="M -4 -2 Q -4 -6, -3 -8" 
          stroke="currentColor" 
          stroke-width="1.5" 
          fill="none" 
          stroke-linecap="round" 
          opacity="0.7"/>
    <path d="M 0 -2 Q 0 -7, 1 -9" 
          stroke="currentColor" 
          stroke-width="1.5" 
          fill="none" 
          stroke-linecap="round" 
          opacity="0.7"/>
    <path d="M 4 -2 Q 4 -6, 5 -8" 
          stroke="currentColor" 
          stroke-width="1.5" 
          fill="none" 
          stroke-linecap="round" 
          opacity="0.7"/>
  </g>
</svg>
